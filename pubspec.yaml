name: portfolio
description: "Portfolio flutter web project"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  scrollable_positioned_list: ^0.3.8
  animated_text_kit: ^4.2.3
  fluttertoast: ^8.2.12
  flutter_svg: ^2.2.0

  # state management
  provider: ^6.1.5+1

  # network
  url_launcher: ^6.3.2
  http: ^1.5.0

  # firebase
  firebase_core: ^4.0.0
  firebase_remote_config: ^6.0.0
  firebase_analytics: ^12.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/

  fonts:
    - family: AppIcons
      fonts:
        - asset: assets/fonts/AppIcons.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 500
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 900
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 400